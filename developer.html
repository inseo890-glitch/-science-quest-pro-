<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>개발자 콘솔 · SCIENCE QUEST PRO</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">🧪 SCIENCE QUEST <span>PRO</span></a><a class="ghost link" href="/">← 메인으로</a></header><main class="wrap"><section class="panel auth-panel"><div class="eyebrow">RESTRICTED AREA</div><h2>🔐 개발자 콘솔</h2><p class="muted">Render 환경 변수 ADMIN_PASSWORD에 설정한 관리자 비밀번호를 입력하세요.</p><form id="adminForm"><label>관리자 비밀번호<input id="adminPassword" type="password" required autocomplete="current-password"></label><button class="primary full">관리자 로그인</button><p class="message" id="adminMessage"></p></form><div id="stats" hidden></div></section></main><script>
const form=document.getElementById("adminForm"),message=document.getElementById("adminMessage"),stats=document.getElementById("stats");
form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="";try{let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("adminPassword").value})});let d=await r.json();if(!r.ok)throw Error(d.error);r=await fetch("/api/admin/stats",{headers:{Authorization:"Bearer "+d.token}});d=await r.json();if(!r.ok)throw Error(d.error);stats.hidden=false;stats.innerHTML='<hr><h3>서비스 통계</h3><p>가입 사용자: <b>'+d.users+'</b></p><p>퀴즈 시도: <b>'+d.rounds+'</b></p><p>총 정답: <b>'+d.scores.points+'</b> / '+d.scores.answered+'</p><h3>리더보드</h3>'+d.leaderboard.map((u,i)=>'<div class="board-row"><span>'+(i+1)+'</span><b>'+String(u.username).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))+'</b><strong>'+u.points+' XP</strong></div>').join("");form.hidden=true;}catch(err){message.textContent=err.message;}});
</script></body></html>
